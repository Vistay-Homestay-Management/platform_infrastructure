name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          docker compose --env-file .env.example --profile dependencies config --quiet
          docker compose -f compose.yaml -f compose.full.yaml --env-file .env.example --profile full config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout subgraph schemas
        run: |
          for repo in service_user service_property service_booking service_finance service_operations service_ota service_notification service_media service_data_warehouse; do
            git clone --depth 1 "https://github.com/Vistay-Homestay-Management/${repo}.git" "../${repo}"
          done
      - name: Validate committed supergraph
        shell: pwsh
        run: |
          ./scripts/Compose-Supergraph.ps1
          git diff --exit-code -- supergraph.graphql
