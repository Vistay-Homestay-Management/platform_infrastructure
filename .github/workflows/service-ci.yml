name: Reusable service CI

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      image-name:
        required: true
        type: string
      docker-context:
        required: false
        type: string
        default: .

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: inputs.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        if: inputs.language == 'node'
        with:
          node-version: '24'
          cache: npm
      - name: Verify Java
        if: inputs.language == 'java'
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Verify Node
        if: inputs.language == 'node'
        run: |
          npm ci
          npm run build
          npm run lint --if-present
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs['image-name'] }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          context: ${{ inputs['docker-context'] }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}
      - name: Promote tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/${{ inputs['image-name'] }}:latest \
            --tag ghcr.io/${{ github.repository_owner }}/${{ inputs['image-name'] }}:sha-${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/${{ inputs['image-name'] }}:test
