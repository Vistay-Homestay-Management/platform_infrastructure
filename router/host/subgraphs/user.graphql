extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@authenticated"])

type Query {
  myProfile: PersonalProfile! @authenticated
  myProfileLinkStatus: ProfileAccountLink! @authenticated
}


type Mutation {
  updateMyProfile(input: UpdateMyProfileInput!): PersonalProfile! @authenticated
  requestMyProfileLink(input: RequestProfileLinkInput!): ProfileAccountLink! @authenticated
  verifyMyProfileLink(input: VerifyProfileLinkInput!): ProfileAccountLink! @authenticated
}

type ProfileAccountLink {
  linkId: ID
  challengeId: ID
  profileType: AccountType!
  status: String!
  maskedRecipient: String
  expiresAt: String
  requiresApproval: Boolean!
  replayed: Boolean!
}

enum AccountType { CUSTOMER ADMIN HOST }
input RequestProfileLinkInput { displayName: String!, cccd: String! }
input VerifyProfileLinkInput { challengeId: ID!, code: String! }

type PersonalProfile {
  accountId: ID!
  profileId: ID!
  displayName: String!
  email: String!
  contactPhone: String
  avatarMediaId: ID
  version: Int!
  updatedAt: String!
  replayed: Boolean!
}

input UpdateMyProfileInput {
  displayName: String!
  contactPhone: String
  avatarMediaId: ID
  expectedVersion: Int!
  reason: String!
  idempotencyKey: String!
}
