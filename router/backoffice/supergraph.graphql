  approveAuthorizationChange(id: ID!, reason: String!, expectedAuthorizationVersion: Int!): AuthorizationChangeRequest! @join__field(graph: USER) @authenticated
  rejectAuthorizationChange(id: ID!, reason: String!): AuthorizationChangeRequest! @join__field(graph: USER) @authenticated
  revokeRoleAssignment(assignmentId: ID!, reason: String!, expectedAuthorizationVersion: Int!): AuthorizationSubject! @join__field(graph: USER) @authenticated
  reduceAuthorizationScopes(input: ReduceAuthorizationScopesInput!): AuthorizationSubject! @join__field(graph: USER) @authenticated
  establishSecondApprover(targetSubjectId: ID!, reason: String!): AuthorizationSubject! @join__field(graph: USER) @authenticated
}

