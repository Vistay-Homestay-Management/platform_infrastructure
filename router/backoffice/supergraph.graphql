scalar join__DirectiveArguments

scalar join__FieldSet

enum join__Graph {
  BOOKING @join__graph(name: "booking", url: "http://service-booking:8080/graphql")
  NOTIFICATION @join__graph(name: "notification", url: "http://service-notification:8080/graphql")
  PAYMENT @join__graph(name: "payment", url: "http://service-payment:8080/graphql")
  USER @join__graph(name: "user", url: "http://service-user:8080/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Mutation
  @join__type(graph: BOOKING)
  @join__type(graph: PAYMENT)
  @join__type(graph: USER)
{
  createPropertyRateProfileVersion(input: CreatePropertyRateProfileVersionInput!): PropertyRateProfileVersion! @join__field(graph: BOOKING) @authenticated
