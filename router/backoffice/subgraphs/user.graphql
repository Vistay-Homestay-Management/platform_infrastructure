extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@authenticated"])

type Query {
  roleCatalog(accountType: AccountType!): [RolePolicyRole!]! @authenticated
  role(accountType: AccountType!, code: String!): RolePolicyRole! @authenticated
  permissionCatalog: [PermissionCatalogEntry!]! @authenticated
  rolePolicyChangeRequests(status: RolePolicyChangeStatus = PENDING): [RolePolicyChangeRequest!]! @authenticated
  loyaltyPrograms: [LoyaltyProgram!]! @authenticated
  loyaltyProgramChangeRequests(status: String): [LoyaltyProgramChangeRequest!]! @authenticated
  myLoyaltyProfile: LoyaltyProfile! @authenticated
  viewer: BackofficeViewer! @authenticated
  myProfile: PersonalProfile! @authenticated
  myProfileLinkStatus: ProfileAccountLink! @authenticated
  profileLinkRequests(profileType: AccountType, status: String = "APPROVAL_PENDING", first: Int = 50): [ProfileLinkReview!]! @authenticated
  userDirectory(accountType: AccountType!, search: String, first: Int = 25, after: String): UserDirectoryPage! @authenticated
  authorizationCatalog(accountType: AccountType!): [AuthorizationRole!]! @authenticated
  authorizationSubject(subjectId: ID!): AuthorizationSubject! @authenticated
  authorizationSubjectByAccount(accountType: AccountType!, accountId: ID!): AuthorizationSubject! @authenticated
  authorizationChangeRequests(status: AuthorizationChangeStatus = PENDING): [AuthorizationChangeRequest!]! @authenticated
  authorizationAudit(targetSubjectId: ID): [AuthorizationAuditEvent!]! @authenticated
}

type Mutation {
  requestCreateRole(input: CreateRoleInput!): RolePolicyChangeRequest! @authenticated
  requestRolePermissionChange(input: RolePermissionChangeInput!): RolePolicyChangeRequest! @authenticated
  approveRolePolicyChange(id: ID!, reason: String!): RolePolicyChangeRequest! @authenticated
  rejectRolePolicyChange(id: ID!, reason: String!): RolePolicyChangeRequest! @authenticated
  requestDeactivateRole(input: DeactivateRoleInput!): RolePolicyChangeRequest! @authenticated
  requestLoyaltyProgramChange(input: LoyaltyProgramChangeInput!): LoyaltyProgramChangeRequest! @authenticated
  approveLoyaltyProgramChange(id: ID!, reason: String!): LoyaltyProgramChangeRequest! @authenticated
  rejectLoyaltyProgramChange(id: ID!, reason: String!): LoyaltyProgramChangeRequest! @authenticated
  adjustQualifyingPoints(input: QualifyingPointAdjustmentInput!): LoyaltyProfile! @authenticated
  updateMyProfile(input: UpdateMyProfileInput!): PersonalProfile! @authenticated
  requestAuthorizationChange(input: RequestAuthorizationChangeInput!): AuthorizationChangeRequest! @authenticated
  approveAuthorizationChange(id: ID!, reason: String!, expectedAuthorizationVersion: Int!): AuthorizationChangeRequest! @authenticated
  rejectAuthorizationChange(id: ID!, reason: String!): AuthorizationChangeRequest! @authenticated
  revokeRoleAssignment(assignmentId: ID!, reason: String!, expectedAuthorizationVersion: Int!): AuthorizationSubject! @authenticated
  reduceAuthorizationScopes(input: ReduceAuthorizationScopesInput!): AuthorizationSubject! @authenticated
  establishSecondApprover(targetSubjectId: ID!, reason: String!): AuthorizationSubject! @authenticated
  protectProfileIdentityDocument(input: ProtectProfileIdentityDocumentInput!): ProtectedIdentityDocument! @authenticated
  requestMyProfileLink(input: RequestProfileLinkInput!): ProfileAccountLink! @authenticated
  verifyMyProfileLink(input: VerifyProfileLinkInput!): ProfileAccountLink! @authenticated
  approveProfileLink(input: ApproveProfileLinkInput!): ProfileAccountLink! @authenticated
  rejectProfileLink(input: RejectProfileLinkInput!): ProfileAccountLink! @authenticated
}

type ProtectedIdentityDocument {
  id: ID!
  profileType: AccountType!
  profileId: ID!
  lookupKeyVersion: Int!
  encryptionKeyVersion: Int!
  assuranceLevel: String!
  rowVersion: String!
  createdAt: String!
}

type ProfileAccountLink {
  linkId: ID
  challengeId: ID
  profileType: AccountType!
  status: String!
  maskedRecipient: String
  expiresAt: String
  requiresApproval: Boolean!
  replayed: Boolean!
}

type ProfileLinkReview {
  linkId: ID!
  profileType: AccountType!
  profileId: ID!
  authAccountId: ID!
  status: String!
  linkMethod: String!
  requestedAt: String!
  maskedRecipient: String
  displayName: String
}

input ProtectProfileIdentityDocumentInput {
  profileType: AccountType!
  profileId: ID!
  cccd: String!
  expectedProfileVersion: String!
  reason: String!
}

input RequestProfileLinkInput {
  displayName: String!
  cccd: String!
}

input VerifyProfileLinkInput {
  challengeId: ID!
  code: String!
}

input ApproveProfileLinkInput {
  linkId: ID!
  reason: String!
}

input RejectProfileLinkInput {
  linkId: ID!
  reason: String!
}

type BackofficeViewer {
  accountId: ID!
  profileId: ID!
  displayName: String!
  email: String!
  contactPhone: String
  avatarMediaId: ID
  profileVersion: Int!
  roles: [String!]!
  permissions: [String!]!
  grants: [EffectiveGrant!]!
  authorizationVersion: Int!
}

type PersonalProfile {
  accountId: ID!
  profileId: ID!
  displayName: String!
  email: String!
  contactPhone: String
  avatarMediaId: ID
  version: Int!
  updatedAt: String!
  replayed: Boolean!
}

type UserDirectoryPage {
  nodes: [UserDirectoryEntry!]!
  totalCount: Int!
  nextCursor: String
}

type UserDirectoryEntry {
  profileId: ID!
  accountId: ID
  accountType: AccountType!
  displayName: String!
  email: String
  contactPhone: String
  status: String!
  referenceCode: String
  subtype: String
  verificationStatus: String
  joinedOn: String
  createdAt: String!
  updatedAt: String!
}

input UpdateMyProfileInput {
  displayName: String!
  contactPhone: String
  avatarMediaId: ID
  expectedVersion: Int!
  reason: String!
  idempotencyKey: String!
}

enum AccountType { CUSTOMER ADMIN HOST }
enum DataScope { SELF OWN ASSIGNED PARTITION ALL }
enum RolePolicyChangeStatus { PENDING APPROVED REJECTED EXPIRED STALE }
enum AuthorizationChangeStatus { PENDING APPROVED REJECTED EXPIRED STALE }

type EffectiveGrant { permissionCode: String!, scopes: [DataScope!]! }
type AuthorizationPermissionPolicy { permissionCode: String!, allowedScopes: [DataScope!]!, defaultScopes: [DataScope!]! }
type AuthorizationRole { code: String!, displayName: String!, accountType: AccountType!, policies: [AuthorizationPermissionPolicy!]! }
type AuthorizationAssignment { id: ID!, roleCode: String!, validUntil: String, grants: [EffectiveGrant!]! }
type AuthorizationSubject {
  id: ID!
  accountType: AccountType!
  accountId: ID!
  profileId: ID!
  active: Boolean!
  authorizationVersion: Int!
  assignments: [AuthorizationAssignment!]!
  effectiveGrants: [EffectiveGrant!]!
}
type AuthorizationChangeRequest {
  id: ID!
  targetSubjectId: ID!
  requestedBySubjectId: ID!
  reviewedBySubjectId: ID
  changeType: String!
  status: AuthorizationChangeStatus!
  roleCode: String!
  reason: String!
  reviewReason: String
  expiresAt: String!
  createdAt: String!
}
type AuthorizationAuditEvent {
  id: ID!
  actorSubjectId: ID
  targetSubjectId: ID
  action: String!
  reason: String!
  correlationId: String
  createdAt: String!
}
input PermissionScopeOverrideInput { permissionCode: String!, scopes: [DataScope!]! }
input RequestAuthorizationChangeInput {
  targetSubjectId: ID!
  roleCode: String!
  scopeOverrides: [PermissionScopeOverrideInput!] = []
  validUntil: String
  reason: String!
  expectedAuthorizationVersion: Int!
  idempotencyKey: String!
}

type RolePolicyGrant { permissionCode: String!, allowedScopes: [DataScope!]!, partitionTypes: [String!]! }
type RolePolicyRole { code: String!, displayName: String!, description: String, accountType: AccountType!, systemRole: Boolean!, active: Boolean!, roleVersion: Int!, grants: [RolePolicyGrant!]!, createdAt: String!, updatedAt: String! }
type PermissionCatalogEntry { code: String!, resource: String!, action: String!, description: String, active: Boolean!, deprecatedAt: String, aliases: [String!]! }
type RolePolicyChangeRequest { id: ID!, roleCode: String!, requestedBySubjectId: ID!, reviewedBySubjectId: ID, changeType: String!, status: RolePolicyChangeStatus!, expectedRoleVersion: Int, reason: String!, reviewReason: String, expiresAt: String!, createdAt: String! }
input RolePolicyGrantInput { permissionCode: String!, allowedScopes: [DataScope!]!, partitionTypes: [String!]! = [] }
input CreateRoleInput { code: String!, displayName: String!, description: String, accountType: AccountType!, grants: [RolePolicyGrantInput!]!, reason: String!, idempotencyKey: String! }
input RolePermissionChangeInput { roleCode: String!, accountType: AccountType!, addGrants: [RolePolicyGrantInput!]! = [], removePermissionCodes: [String!]! = [], expectedRoleVersion: Int!, reason: String!, idempotencyKey: String! }
input DeactivateRoleInput { roleCode: String!, accountType: AccountType!, expectedRoleVersion: Int!, reason: String!, idempotencyKey: String! }

type LoyaltyTier { code: String!, displayName: String!, minimumPoints: String!, displayOrder: Int! }
type LoyaltyProfile { status: String!, qualifyingPoints: String!, currentTier: LoyaltyTier, nextTier: LoyaltyTier, pointsToNextTier: String, policyVersion: Int, asOf: String! }
type LoyaltyProgramVersion { id: ID!, version: Int!, status: String!, qualificationWindow: String!, rollingWindowDays: Int, effectiveFrom: String!, effectiveTo: String, fingerprint: String!, tiers: [LoyaltyTier!]! }
type LoyaltyProgram { id: ID!, code: String!, name: String!, scopeType: String!, scopeId: ID, active: Boolean!, rowVersion: String!, versions: [LoyaltyProgramVersion!]! }
type LoyaltyProgramChangeRequest { id: ID!, programCode: String!, expectedProgramVersion: String, requestedBySubjectId: ID!, reviewedBySubjectId: ID, status: String!, reason: String!, reviewReason: String, createdAt: String!, reviewedAt: String }
input LoyaltyTierInput { code: String!, displayName: String!, minimumPoints: String!, displayOrder: Int! }
input LoyaltyEarningRuleInput { code: String!, ruleType: String!, points: String!, amountBlock: String, priority: Int = 0 }
input LoyaltyProgramChangeInput { code: String!, name: String!, scopeType: String = "GLOBAL", scopeId: ID, qualificationWindow: String = "LIFETIME", rollingWindowDays: Int, effectiveFrom: String!, effectiveTo: String, expectedVersion: String, tiers: [LoyaltyTierInput!]!, earningRules: [LoyaltyEarningRuleInput!]! = [], reason: String!, idempotencyKey: String! }
input QualifyingPointAdjustmentInput { customerAccountId: ID!, delta: String!, reason: String!, idempotencyKey: String! }
input RetainedPermissionScopesInput { permissionCode: String!, scopes: [DataScope!]! }
input ReduceAuthorizationScopesInput {
  assignmentId: ID!
  retainedScopes: [RetainedPermissionScopesInput!]!
  reason: String!
  expectedAuthorizationVersion: Int!
}
