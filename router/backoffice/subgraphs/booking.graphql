extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@authenticated"])

type Query {
  booking(id: ID!): Booking! @authenticated
  bookings(status: String, limit: Int = 50): [Booking!]! @authenticated
}

type Booking {
  id: ID!
  bookingCode: String!
  propertyId: ID!
  status: String!
  checkInDate: String!
  checkOutDate: String!
  totalAmount: String!
  currency: String!
}
