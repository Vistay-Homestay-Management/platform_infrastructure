extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@authenticated"])

type Query {
  booking(id: ID!): Booking! @authenticated
  bookings(status: String, limit: Int = 50): [Booking!]! @authenticated
  propertyAvailability(input: PropertyAvailabilityInput!): PropertyAvailabilityObservation! @authenticated
  propertyRateProfileVersion(id: ID!): PropertyRateProfileVersion! @authenticated
  propertyRateProfileVersions(propertyId: ID!): [PropertyRateProfileVersion!]! @authenticated
  calculatePropertyPriceQuote(input: CalculatePropertyPriceQuoteInput!): PropertyPriceQuote! @authenticated
  previewPropertyRateProfilePublication(rateProfileVersionId: ID!): PricingProfilePublicationPreview! @authenticated
  activePropertyRateProfileVersion(propertyId: ID!, checkInDate: String!, checkOutDate: String!): PricingProfilePublication! @authenticated
  previewPublishedPropertyPriceQuote(input: PublishedPropertyPriceQuoteInput!): PublishedPropertyPriceQuotePreview! @authenticated
  propertyPriceQuoteSnapshot(id: ID!): PropertyPriceQuoteSnapshot! @authenticated
}

type Mutation {
  createInventoryBlock(input: CreateInventoryBlockInput!): InventoryBlockCommandResult! @authenticated
  releaseInventoryBlock(input: ReleaseInventoryBlockInput!): InventoryBlockCommandResult! @authenticated
  createPropertyRateProfileVersion(input: CreatePropertyRateProfileVersionInput!): PropertyRateProfileVersion! @authenticated
  applyPropertyPriceOverride(input: ApplyPropertyPriceOverrideInput!): AppliedPropertyPriceOverride! @authenticated
  publishPropertyRateProfileVersion(input: PublishPropertyRateProfileVersionInput!): PricingProfilePublication! @authenticated
  createPropertyPriceQuoteSnapshot(input: CreatePropertyPriceQuoteSnapshotInput!): PropertyPriceQuoteSnapshot! @authenticated
}

type Booking {
  id: ID!
  bookingCode: String!
  propertyId: ID!
  status: String!
  checkInDate: String!
  checkOutDate: String!
  totalAmount: String
  currency: String!
}

type PropertyAvailabilityObservation {
  propertyId: ID!
  checkInDate: String!
  checkOutDate: String!
  available: Boolean!
  inventoryRevision: String!
  branchId: ID!
  propertyMembershipVersion: String!
  observedAt: String!
  overlaps: [InventoryAvailabilityOverlap!]!
}

type InventoryAvailabilityOverlap {
  type: InventoryBlockType!
  status: InventoryBlockStatus!
  startDate: String!
  endDateExclusive: String!
  channelProvider: String
}

type InventoryBlockCommandResult {
  commandId: ID!
  idempotencyKey: String!
  requestHash: String!
  inventoryBlockId: ID!
  action: InventoryBlockCommandAction!
  propertyId: ID!
  blockType: InventoryBlockType!
  status: InventoryBlockStatus!
  startDate: String!
  endDateExclusive: String!
  blockVersion: String!
  inventoryRevision: String!
  branchId: ID!
  propertyMembershipVersion: String!
  occurredAt: String!
  releasedAt: String
}

type PropertyRateProfileVersion {
  id: ID!
  propertyId: ID!
  version: Int!
  effectiveFrom: String!
  effectiveToExclusive: String
  baseDailyRate: String!
  mediumDailyFactorBps: Int!
  longDailyFactorBps: Int!
  currency: String!
  checkInTime: String!
  checkOutTime: String!
  turnoverMinutes: Int!
  quoteTtlMinutes: Int!
  commissionDefaultBps: Int!
  commissionMaxBps: Int!
  reason: String!
  authoredByAdminAccountId: ID!
  correlationId: String
  authoredAt: String!
  rules: [PricingRuleVersion!]!
}

type PricingRuleVersion {
  id: ID!
  code: String!
  name: String!
  effectiveFrom: String!
  effectiveToExclusive: String
  priority: Int!
  daysOfWeek: [Int!]!
  channels: [PricingChannel!]!
  minimumStayDays: Int
  maximumStayDays: Int
  minimumGuests: Int
  maximumGuests: Int
  actionType: PricingActionType!
  actionValue: String!
}

type PropertyPriceQuote {
  fingerprint: String!
  calculationVersion: String!
  roundingPolicy: String!
  rateProfileVersionId: ID!
  propertyId: ID!
  profileVersion: Int!
  checkInDate: String!
  checkOutDate: String!
  guestCount: Int!
  channel: PricingChannel!
  staffCreated: Boolean!
  stayProduct: StayProduct!
  stayDays: Int!
  baseDailyRate: String!
  dailyFactorBps: Int!
  productDailyRate: String!
  baseLodgingAmount: String!
  lodgingBeforeAdjustments: String!
  discountAmount: String!
  surchargeAmount: String!
  lodgingAmount: String!
  requestedCommissionBps: Int
  commissionDefaultBps: Int!
  commissionMaxBps: Int!
  commissionBaseAmount: String!
  commissionBps: Int!
  commissionAmount: String!
  totalAmount: String!
  currency: String!
  precedence: [String!]!
  evaluatedRules: [PricingRuleEvaluation!]!
  components: [PriceComponent!]!
}

type AppliedPropertyPriceOverride {
  baseQuote: PropertyPriceQuote!
  manualOverride: PricingManualOverride!
  finalPrecedence: [String!]!
  finalComponents: [PriceComponent!]!
  finalLodgingAmount: String!
  finalCommissionAmount: String!
  finalTotalAmount: String!
}

type PricingManualOverride {
  id: ID!
  idempotencyKey: String!
  requestHash: String!
  propertyId: ID!
  rateProfileVersionId: ID!
  baseQuoteFingerprint: String!
  calculationVersion: String!
  beforeLodgingAmount: String!
  targetLodgingAmount: String!
  adjustmentAmount: String!
  reductionBps: Int!
  commissionBps: Int!
  beforeCommissionAmount: String!
  afterCommissionAmount: String!
  beforeTotalAmount: String!
  afterTotalAmount: String!
  currency: String!
  largeApprovalRequired: Boolean!
  actorAdminAccountId: ID!
  actorAdminProfileId: ID!
  authorizationVersion: String!
  overridePermissionCode: String!
  overrideScopeType: PricingOverrideScopeType!
  overridePartitionId: ID
  largeApprovalAuthorizationVersion: String
  largeApprovalPermissionCode: String
  largeApprovalScopeType: PricingOverrideScopeType
  largeApprovalPartitionId: ID
  reason: String!
  correlationId: String!
  quoteTtlMinutes: Int!
  createdAt: String!
  expiresAt: String!
}

type PricingProfilePublicationPreview {
  profile: PropertyRateProfileVersion!
  profileFingerprint: String!
  published: Boolean!
  currentPublication: PricingProfilePublication
  publication: PricingProfilePublication
}

type PricingProfilePublication {
  id: ID!
  idempotencyKey: String!
  requestHash: String!
  propertyId: ID!
  rateProfileVersionId: ID!
  previousPublicationId: ID
  publicationRevision: String!
  profileFingerprint: String!
  snapshotSchemaVersion: String!
  actorAdminAccountId: ID!
  actorAdminProfileId: ID!
  authorizationVersion: String!
  permissionCode: String!
  scopeType: PricingOverrideScopeType!
  partitionId: ID
  reason: String!
  correlationId: String!
  publishedAt: String!
  profile: PropertyRateProfileVersion!
}

type PublishedPropertyPriceQuotePreview {
  publication: PricingProfilePublication!
  baseQuote: PropertyPriceQuote!
}

type PropertyPriceFinalQuote {
  baseQuote: PropertyPriceQuote!
  manualOverride: PricingManualOverride
  precedence: [String!]!
  components: [PriceComponent!]!
  lodgingAmount: String!
  commissionAmount: String!
  totalAmount: String!
}

type PropertyPriceQuoteSnapshot {
  id: ID!
  idempotencyKey: String!
  requestHash: String!
  propertyId: ID!
  pricingPublicationId: ID!
  rateProfileVersionId: ID!
  manualOverrideId: ID
  baseQuoteFingerprint: String!
  calculationVersion: String!
  publication: PricingProfilePublication!
  baseQuote: PropertyPriceQuote!
  finalQuote: PropertyPriceFinalQuote!
  actorAdminAccountId: ID!
  actorAdminProfileId: ID!
  authorizationVersion: String!
  permissionCode: String!
  scopeType: PricingOverrideScopeType!
  partitionId: ID
  reason: String!
  correlationId: String!
  status: String!
  currency: String!
  createdAt: String!
  expiresAt: String!
}

type PricingRuleEvaluation {
  order: Int!
  chargeDate: String
  ruleId: ID!
  code: String!
  priority: Int!
  status: PricingRuleEvaluationStatus!
  reason: String!
  actionType: PricingActionType!
  actionValue: String!
  beforeAmount: String!
  adjustmentAmount: String!
  afterAmount: String!
}

type PriceComponent {
  order: Int!
  type: PriceComponentType!
  code: String!
  chargeDate: String
  ruleCode: String
  quantity: Int!
  unitAmount: String!
  factorBps: Int
  amount: String!
}

enum StayProduct {
  SHORT
  MEDIUM
  LONG
}

enum PricingRuleEvaluationStatus {
  MATCHED
  SKIPPED
  SUPERSEDED
}

enum PriceComponentType {
  PROFILE_BASE_RATE
  FIXED_DAILY_RATE
  STAY_PRODUCT_RATE
  RULE_DISCOUNT
  RULE_SURCHARGE
  MANUAL_OVERRIDE
  COMMISSION
}

enum PricingOverrideScopeType {
  ALL
  BRANCH
}

enum PricingChannel {
  ADMIN_PORTAL
  CUSTOMER_WEB
  OTA
}

enum PricingActionType {
  FIXED_DAILY_RATE
  PERCENT_DISCOUNT
  FIXED_DISCOUNT
  PERCENT_SURCHARGE
  FIXED_SURCHARGE
}

enum InventoryBlockType {
  BOOKING
  MAINTENANCE
  CLEANING
  OWNER_USE
  MANUAL
  CHANNEL
}

enum InventoryBlockStatus {
  TENTATIVE
  ACTIVE
  RELEASED
  CANCELLED
}

enum OperatorInventoryBlockType {
  MAINTENANCE
  CLEANING
  OWNER_USE
  MANUAL
}

enum InventoryBlockCommandAction {
  CREATED
  RELEASED
}

input PropertyAvailabilityInput {
  propertyId: ID!
  checkInDate: String!
  checkOutDate: String!
}

input CreateInventoryBlockInput {
  idempotencyKey: String!
  propertyId: ID!
  blockType: OperatorInventoryBlockType!
  startDate: String!
  endDateExclusive: String!
  expectedInventoryRevision: String!
  reason: String!
  correlationId: String!
}

input ReleaseInventoryBlockInput {
  idempotencyKey: String!
  propertyId: ID!
  inventoryBlockId: ID!
  expectedInventoryRevision: String!
  reason: String!
  correlationId: String!
}

input CreatePropertyRateProfileVersionInput {
  idempotencyKey: String!
  propertyId: ID!
  effectiveFrom: String!
  effectiveToExclusive: String
  baseDailyRate: String!
  mediumDailyFactorBps: Int = 7000
  longDailyFactorBps: Int = 5500
  checkInTime: String = "14:00"
  checkOutTime: String = "12:00"
  turnoverMinutes: Int = 120
  quoteTtlMinutes: Int = 15
  commissionDefaultBps: Int = 500
  commissionMaxBps: Int = 2000
  reason: String!
  correlationId: String
  rules: [PricingRuleVersionInput!]! = []
}

input PricingRuleVersionInput {
  code: String!
  name: String!
  effectiveFrom: String!
  effectiveToExclusive: String
  priority: Int!
  daysOfWeek: [Int!]! = []
  channels: [PricingChannel!]! = []
  minimumStayDays: Int
  maximumStayDays: Int
  minimumGuests: Int
  maximumGuests: Int
  actionType: PricingActionType!
  actionValue: String!
}

input CalculatePropertyPriceQuoteInput {
  rateProfileVersionId: ID!
  propertyId: ID!
  checkInDate: String!
  checkOutDate: String!
  guestCount: Int! = 1
  channel: PricingChannel!
  staffCreated: Boolean! = false
  commissionBps: Int
}

input ApplyPropertyPriceOverrideInput {
  idempotencyKey: String!
  quote: CalculatePropertyPriceQuoteInput!
  expectedBaseQuoteFingerprint: String!
  targetLodgingAmount: String!
  reason: String!
  correlationId: String!
}

input PublishPropertyRateProfileVersionInput {
  idempotencyKey: String!
  rateProfileVersionId: ID!
  expectedProfileFingerprint: String!
  expectedCurrentPublicationId: ID
  reason: String!
  correlationId: String!
}

input PublishedPropertyPriceQuoteInput {
  propertyId: ID!
  checkInDate: String!
  checkOutDate: String!
  guestCount: Int! = 1
  channel: PricingChannel!
  staffCreated: Boolean! = false
  commissionBps: Int
}

input CreatePropertyPriceQuoteSnapshotInput {
  idempotencyKey: String!
  quote: PublishedPropertyPriceQuoteInput!
  expectedRateProfileVersionId: ID!
  expectedBaseQuoteFingerprint: String!
  manualOverrideId: ID
  reason: String!
  correlationId: String!
}
