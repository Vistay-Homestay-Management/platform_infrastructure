supergraph:
  listen: 0.0.0.0:4000

health_check:
  listen: 0.0.0.0:8088

homepage:
  enabled: false

sandbox:
  enabled: false

include_subgraph_errors:
  all: false

headers:
  all:
    request:
      - propagate:
          named: authorization
      - propagate:
          named: traceparent
      - propagate:
          named: tracestate
      - propagate:
          named: x-request-id

telemetry:
  exporters:
    tracing:
      common:
        service_name: vistay-apollo-router
