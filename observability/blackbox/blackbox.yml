modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4

  frontend_admin:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      headers:
        Host: admin.localhost

  frontend_host:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      headers:
        Host: host.localhost

  frontend_customer:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      headers:
        Host: customer.localhost

  router_http:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 400, 401, 403, 405]
      preferred_ip_protocol: ip4
