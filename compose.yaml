name: vistay

x-postgres-image: &postgres-image postgres:18.6-alpine
x-kafka-image: &kafka-image apache/kafka:4.3.1

services:
  postgres:
    image: *postgres-image
    profiles: ["dependencies", "identity", "edge", "epic01", "full"]
    environment:
      POSTGRES_DB: vistay
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTHENTICATION_DB_MIGRATOR_PASSWORD: ${AUTHENTICATION_DB_MIGRATOR_PASSWORD:?set AUTHENTICATION_DB_MIGRATOR_PASSWORD}
      AUTHENTICATION_DB_APP_PASSWORD: ${AUTHENTICATION_DB_APP_PASSWORD:?set AUTHENTICATION_DB_APP_PASSWORD}
      USER_DB_MIGRATOR_PASSWORD: ${USER_DB_MIGRATOR_PASSWORD:?set USER_DB_MIGRATOR_PASSWORD}
      USER_DB_APP_PASSWORD: ${USER_DB_APP_PASSWORD:?set USER_DB_APP_PASSWORD}
      NOTIFICATION_DB_MIGRATOR_PASSWORD: ${NOTIFICATION_DB_MIGRATOR_PASSWORD:?set NOTIFICATION_DB_MIGRATOR_PASSWORD}
      NOTIFICATION_DB_APP_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD:?set NOTIFICATION_DB_APP_PASSWORD}
      FINANCE_DB_MIGRATOR_PASSWORD: ${FINANCE_DB_MIGRATOR_PASSWORD:?set FINANCE_DB_MIGRATOR_PASSWORD}
      FINANCE_DB_APP_PASSWORD: ${FINANCE_DB_APP_PASSWORD:?set FINANCE_DB_APP_PASSWORD}
      PAYMENT_DB_MIGRATOR_PASSWORD: ${PAYMENT_DB_MIGRATOR_PASSWORD:?set PAYMENT_DB_MIGRATOR_PASSWORD}
      PAYMENT_DB_APP_PASSWORD: ${PAYMENT_DB_APP_PASSWORD:?set PAYMENT_DB_APP_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/local-init.sql:/docker-entrypoint-initdb.d/00-local-init.sql:ro
      - ./database/local-epic01-security.sh:/docker-entrypoint-initdb.d/01-local-epic01-security.sh:ro
      - ./database/local-epic01-security.sql:/opt/vistay/local-epic01-security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vistay]

  redis:
    image: redis:8.10.2-alpine
    profiles: ["dependencies", "epic01", "full"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [vistay]

  kafka:
    image: *kafka-image
    profiles: ["dependencies", "epic01", "full"]
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_LISTENERS: CONTROLLER://:9091,INTERNAL://:9092,CLIENT://:9094,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,CLIENT://kafka:9094,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL,CLIENT:SASL_SSL,EXTERNAL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_CLIENT_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/broker/kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?set KAFKA_STORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?set KAFKA_STORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/broker/kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?set KAFKA_STORE_PASSWORD}
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_INTERNAL_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_CLIENT_SSL_CLIENT_AUTH: none
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_CLIENT_AUTH: none
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:CN=kafka,OU=Platform,O=ViStay,L=Ho Chi Minh City,C=VN;User:CN=vistay-kafka-admin,OU=Platform,O=ViStay,L=Ho Chi Minh City,C=VN"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9093}:9093"
    expose:
      - "9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./certs/generated/kafka/broker:/etc/kafka/broker:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /etc/kafka/broker/broker.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [vistay]

  kafka-init:
    image: *kafka-image
    profiles: ["dependencies", "epic01", "full"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?set KAFKA_ADMIN_PASSWORD}
      KAFKA_AUTHENTICATION_PASSWORD: ${KAFKA_AUTHENTICATION_PASSWORD:?set KAFKA_AUTHENTICATION_PASSWORD}
      KAFKA_USER_PASSWORD: ${KAFKA_USER_PASSWORD:?set KAFKA_USER_PASSWORD}
      KAFKA_PROPERTY_PASSWORD: ${KAFKA_PROPERTY_PASSWORD:?set KAFKA_PROPERTY_PASSWORD}
      KAFKA_BOOKING_PASSWORD: ${KAFKA_BOOKING_PASSWORD:?set KAFKA_BOOKING_PASSWORD}
      KAFKA_FINANCE_PASSWORD: ${KAFKA_FINANCE_PASSWORD:?set KAFKA_FINANCE_PASSWORD}
      KAFKA_PAYMENT_PASSWORD: ${KAFKA_PAYMENT_PASSWORD:?set KAFKA_PAYMENT_PASSWORD}
      KAFKA_OPERATIONS_PASSWORD: ${KAFKA_OPERATIONS_PASSWORD:?set KAFKA_OPERATIONS_PASSWORD}
      KAFKA_OTA_PASSWORD: ${KAFKA_OTA_PASSWORD:?set KAFKA_OTA_PASSWORD}
      KAFKA_NOTIFICATION_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD:?set KAFKA_NOTIFICATION_PASSWORD}
      KAFKA_MEDIA_PASSWORD: ${KAFKA_MEDIA_PASSWORD:?set KAFKA_MEDIA_PASSWORD}
      KAFKA_WAREHOUSE_PASSWORD: ${KAFKA_WAREHOUSE_PASSWORD:?set KAFKA_WAREHOUSE_PASSWORD}
      KAFKA_STORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?set KAFKA_STORE_PASSWORD}
    volumes:
      - ./certs/generated/kafka/admin:/etc/kafka/admin:ro
      - ./kafka/init.sh:/opt/vistay/init.sh:ro
    entrypoint: ["/bin/bash", "/opt/vistay/init.sh"]
    networks: [vistay]

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    profiles: ["dependencies", "full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vistay]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector:0.163.2@sha256:63e5e8eccf4268be02388ba9f2dc36b80b5e47721291293411c0e83152d75bda}
    profiles: ["dependencies", "epic01", "full"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTEL_HEALTH_BIND_ADDRESS:-127.0.0.1}:${OTEL_HEALTH_PORT:-13133}:13133"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [vistay]

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244}
    profiles: ["identity", "edge", "epic01", "full"]
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:-jdbc:postgresql://postgres:5432/vistay_keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?set KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://identity.localhost}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
    expose:
      - "8080"
      - "9000"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [vistay]

  router-backoffice:
    image: ${HIVE_ROUTER_IMAGE:-ghcr.io/graphql-hive/router:0.3.5@sha256:feaf52e70615f8516d86c4c07f6f29046d88e1b38f9cf6aa099d17b2b51f4827}
    profiles: ["edge", "epic01", "full"]
    environment:
      ROUTER_CONFIG_FILE_PATH: /app/config/router.config.yaml
      BACKOFFICE_JWKS_URL: ${BACKOFFICE_JWKS_URL:-http://keycloak:8080/realms/vistay-backoffice/protocol/openid-connect/certs}
      BACKOFFICE_JWT_AUDIENCES: ${BACKOFFICE_JWT_AUDIENCES:-vistay-backoffice-api}
      BACKOFFICE_JWT_ISSUERS: ${BACKOFFICE_JWT_ISSUERS:-http://identity.localhost/realms/vistay-backoffice}
      BACKOFFICE_CORS_ALLOWED_ORIGINS: ${BACKOFFICE_CORS_ALLOWED_ORIGINS:-http://admin.localhost}
      LOG_LEVEL: ${HIVE_ROUTER_LOG_LEVEL:-info}
      LOG_FORMAT: json
    expose:
      - "4000"
    volumes:
      - ./router/backoffice/router.config.yaml:/app/config/router.config.yaml:ro
      - ./router/backoffice/supergraph.graphql:/app/schema/supergraph.graphql:ro
    depends_on:
      keycloak:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 50s
    restart: unless-stopped
    networks: [vistay]

  nginx:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0}
    profiles: ["edge", "epic01", "full"]
    environment:
      BACKOFFICE_GRAPHQL_HOST: ${BACKOFFICE_GRAPHQL_HOST:-graphql.localhost}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:-identity.localhost}
      BACKOFFICE_WEB_HOST: ${BACKOFFICE_WEB_HOST:-admin.localhost}
      BACKOFFICE_AUTH_HOST: ${BACKOFFICE_AUTH_HOST:-auth.localhost}
      OBJECT_STORAGE_HOST: ${OBJECT_STORAGE_HOST:-objects.localhost}
      CHANNEL_MANAGER_WEBHOOK_HOST: ${CHANNEL_MANAGER_WEBHOOK_HOST:-channels.localhost}
      PAYMENT_WEBHOOK_HOST: ${PAYMENT_WEBHOOK_HOST:-payments.localhost}
      NGINX_ENVSUBST_FILTER: ^(BACKOFFICE_GRAPHQL_HOST|KEYCLOAK_HOST|BACKOFFICE_WEB_HOST|BACKOFFICE_AUTH_HOST|OBJECT_STORAGE_HOST|CHANNEL_MANAGER_WEBHOOK_HOST|PAYMENT_WEBHOOK_HOST)
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      keycloak:
        condition: service_healthy
      router-backoffice:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [vistay]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:

networks:
  vistay:
    name: vistay
