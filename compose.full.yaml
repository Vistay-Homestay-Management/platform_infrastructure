services:
  authentication:
    build: ../service_authentication
    profiles: ["full"]
    environment:
      DB_HOST: postgres
      DB_NAME: vistay_authentication_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OIDC_ISSUER_URI: ${BACKOFFICE_JWT_ISSUERS}
      OIDC_JWK_SET_URI: ${BACKOFFICE_JWKS_URL}
      OIDC_AUDIENCE: ${BACKOFFICE_JWT_AUDIENCES}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SSL
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [vistay]

  user:
    container_name: service-user
    build: ../service_user
    profiles: ["full"]
    environment:
      DB_HOST: postgres
      DB_NAME: vistay_user_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER_URI: ${BACKOFFICE_JWT_ISSUERS}
      OIDC_JWK_SET_URI: ${BACKOFFICE_JWKS_URL}
      OIDC_AUDIENCE: ${BACKOFFICE_JWT_AUDIENCES}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SSL
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [vistay]

  property:
    container_name: service-property
    build: ../service_property
    profiles: ["full"]
    environment: &service-environment
      DB_HOST: postgres
      DB_NAME: vistay_property_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER_URI: ${BACKOFFICE_JWT_ISSUERS}
      OIDC_JWK_SET_URI: ${BACKOFFICE_JWKS_URL}
      OIDC_AUDIENCE: ${BACKOFFICE_JWT_AUDIENCES}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SSL
    expose: ["8080"]
    depends_on: &service-dependencies
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [vistay]

  booking:
    container_name: service-booking
    build: ../service_booking
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_booking_db
    expose: ["8080"]
    depends_on: *service-dependencies
    networks: [vistay]

  finance:
    container_name: service-finance
    build: ../service_finance
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_finance_db
    expose: ["8080"]
    depends_on: *service-dependencies
    networks: [vistay]

  operations:
    container_name: service-operations
    build: ../service_operations
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_operations_db
    expose: ["8080"]
    depends_on: *service-dependencies
    networks: [vistay]

  ota:
    container_name: service-ota
    build: ../service_ota
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_ota_db
    expose: ["8080"]
    depends_on: *service-dependencies
    networks: [vistay]

  notification:
    container_name: service-notification
    build: ../service_notification
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_notification_db
    expose: ["8080"]
    depends_on: *service-dependencies
    networks: [vistay]

  media:
    container_name: service-media
    build: ../service_media
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_media_db
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    expose: ["8080"]
    depends_on:
      <<: *service-dependencies
      minio:
        condition: service_healthy
    networks: [vistay]

  warehouse:
    container_name: service-data-warehouse
    build: ../service_data_warehouse
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_warehouse_db
    expose: ["8080"]
    depends_on: *service-dependencies
    networks: [vistay]

  router-backoffice:
    depends_on:
      user:
        condition: service_started
      property:
        condition: service_started
      booking:
        condition: service_started
      finance:
        condition: service_started
      operations:
        condition: service_started
      ota:
        condition: service_started
      notification:
        condition: service_started
      media:
        condition: service_started
      warehouse:
        condition: service_started

  caddy:
    depends_on:
      frontend-admin:
        condition: service_started
      minio:
        condition: service_healthy
      ota:
        condition: service_started

  frontend-customer:
    build: ../frontend_customer
    profiles: ["full"]
    expose: ["8080"]
    networks: [vistay]

  frontend-host:
    build: ../frontend_host
    profiles: ["full"]
    expose: ["8080"]
    networks: [vistay]

  frontend-admin:
    build: ../frontend_admin
    profiles: ["full"]
    expose: ["8080"]
    networks: [vistay]
