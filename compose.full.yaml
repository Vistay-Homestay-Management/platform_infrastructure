x-service-environment: &service-environment
  DB_HOST: postgres
  KEYCLOAK_BACKOFFICE_ISSUER: ${BACKOFFICE_JWT_ISSUERS}
  KEYCLOAK_BACKOFFICE_JWKS_URI: ${BACKOFFICE_JWKS_URL}
  KEYCLOAK_BACKOFFICE_AUDIENCE: ${BACKOFFICE_JWT_AUDIENCES}
  # Compatibility for bounded contexts that have not yet adopted the explicit
  # public-issuer/internal-JWKS variable names.
  OIDC_ISSUER_URI: ${BACKOFFICE_JWT_ISSUERS}
  OIDC_JWK_SET_URI: ${BACKOFFICE_JWKS_URL}
  OIDC_AUDIENCE: ${BACKOFFICE_JWT_AUDIENCES}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9094
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_TRUSTSTORE_LOCATION: /run/secrets/kafka/kafka.truststore.jks
  KAFKA_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-1.0}
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

x-service-dependencies: &service-dependencies
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully
  keycloak:
    condition: service_healthy
  otel-collector:
    condition: service_healthy

services:
  authentication:
    container_name: service-authentication
    build: ../service_authentication
    profiles: ["epic01", "full"]
    environment:
      <<: *service-environment
      OTEL_SERVICE_NAME: vistay-authentication-service
      DB_NAME: vistay_authentication_db
      DB_USERNAME: vistay_authentication_app
      DB_PASSWORD: ${AUTHENTICATION_DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: vistay_authentication_migrator
      SPRING_FLYWAY_PASSWORD: ${AUTHENTICATION_DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-authentication" password="${KAFKA_AUTHENTICATION_PASSWORD}";
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_BACKOFFICE_REALM: vistay-backoffice
      KEYCLOAK_ADMIN_CLIENT_ID: vistay-auth-facade
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      VISTAY_BOOTSTRAP_TOKEN: ${VISTAY_BOOTSTRAP_TOKEN}
      USER_GRPC_ADDRESS: static://user:9090
      USER_GRPC_SSL_BUNDLE: grpc-user-client
      GRPC_CLIENT_CERT: file:/run/secrets/grpc/authentication.crt
      GRPC_CLIENT_KEY: file:/run/secrets/grpc/authentication.key
      GRPC_SERVER_CA_CERT: file:/run/secrets/grpc/ca.crt
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
      - ./certs/generated/grpc/authentication-client:/run/secrets/grpc:ro
    depends_on:
      <<: *service-dependencies
      redis:
        condition: service_healthy
    networks: [vistay]

  user:
    container_name: service-user
    build: ../service_user
    profiles: ["epic01", "full"]
    environment:
      <<: *service-environment
      OTEL_SERVICE_NAME: vistay-user-service
      DB_NAME: vistay_user_db
      DB_USERNAME: vistay_user_app
      DB_PASSWORD: ${USER_DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: vistay_user_migrator
      SPRING_FLYWAY_PASSWORD: ${USER_DB_MIGRATOR_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-user" password="${KAFKA_USER_PASSWORD}";
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GRPC_SERVER_PORT: 9090
      GRPC_TLS_ENABLED: "true"
      GRPC_SSL_BUNDLE: grpc-server
      GRPC_SERVER_CERT: file:/run/secrets/grpc/server.crt
      GRPC_SERVER_KEY: file:/run/secrets/grpc/server.key
      GRPC_CLIENT_CA_CERT: file:/run/secrets/grpc/ca.crt
      GRPC_ALLOWED_CALLER_URIS: spiffe://vistay/service/authentication,spiffe://vistay/service/booking,spiffe://vistay/service/finance,spiffe://vistay/service/payment,spiffe://vistay/service/notification
      GRPC_MAXIMUM_DEADLINE: 2s
    expose: ["8080", "9090"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
      - ./certs/generated/grpc/user-server:/run/secrets/grpc:ro
    depends_on:
      <<: *service-dependencies
      redis:
        condition: service_healthy
    networks: [vistay]

  notification:
    container_name: service-notification
    build: ../service_notification
    profiles: ["epic01", "full"]
    environment:
      <<: *service-environment
      OTEL_SERVICE_NAME: vistay-notification-service
      DB_NAME: vistay_notification_db
      DB_USERNAME: vistay_notification_app
      DB_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: vistay_notification_migrator
      SPRING_FLYWAY_PASSWORD: ${NOTIFICATION_DB_MIGRATOR_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-notification" password="${KAFKA_NOTIFICATION_PASSWORD}";
      USER_GRPC_ADDRESS: static://user:9090
      USER_GRPC_SSL_BUNDLE: grpc-user-client
      GRPC_CLIENT_CERT: file:/run/secrets/grpc/notification.crt
      GRPC_CLIENT_KEY: file:/run/secrets/grpc/notification.key
      GRPC_SERVER_CA_CERT: file:/run/secrets/grpc/ca.crt
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
      - ./certs/generated/grpc/notification-client:/run/secrets/grpc:ro
    depends_on:
      <<: *service-dependencies
      user:
        condition: service_started
    networks: [vistay]

  property:
    container_name: service-property
    build: ../service_property
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_property_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-property" password="${KAFKA_PROPERTY_PASSWORD}";
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
    depends_on: *service-dependencies
    networks: [vistay]

  booking:
    container_name: service-booking
    build: ../service_booking
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_booking_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-booking" password="${KAFKA_BOOKING_PASSWORD}";
      USER_GRPC_ADDRESS: static://user:9090
      USER_GRPC_SSL_BUNDLE: grpc-user-client
      GRPC_CLIENT_CERT: file:/run/secrets/grpc/booking.crt
      GRPC_CLIENT_KEY: file:/run/secrets/grpc/booking.key
      GRPC_SERVER_CA_CERT: file:/run/secrets/grpc/ca.crt
      GRPC_SERVER_PORT: 9090
      GRPC_TLS_ENABLED: "true"
      GRPC_SSL_BUNDLE: grpc-booking-server
      BOOKING_GRPC_SERVER_CERT: file:/run/secrets/grpc/server/server.crt
      BOOKING_GRPC_SERVER_KEY: file:/run/secrets/grpc/server/server.key
      BOOKING_GRPC_CLIENT_CA_CERT: file:/run/secrets/grpc/server/ca.crt
      GRPC_ALLOWED_CALLER_URIS: spiffe://vistay/service/payment
      GRPC_MAXIMUM_DEADLINE: 2s
    expose: ["8080", "9090"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
      - ./certs/generated/grpc/booking-client:/run/secrets/grpc:ro
      - ./certs/generated/grpc/booking-server:/run/secrets/grpc/server:ro
    depends_on:
      <<: *service-dependencies
      user:
        condition: service_started
    networks: [vistay]

  finance:
    container_name: service-finance
    build: ../service_finance
    profiles: ["epic01", "full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_finance_db
      DB_USERNAME: vistay_finance_app
      DB_PASSWORD: ${FINANCE_DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: vistay_finance_migrator
      SPRING_FLYWAY_PASSWORD: ${FINANCE_DB_MIGRATOR_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-finance" password="${KAFKA_FINANCE_PASSWORD}";
      USER_GRPC_ADDRESS: static://user:9090
      USER_GRPC_SSL_BUNDLE: grpc-user-client
      GRPC_CLIENT_CERT: file:/run/secrets/grpc/finance.crt
      GRPC_CLIENT_KEY: file:/run/secrets/grpc/finance.key
      GRPC_SERVER_CA_CERT: file:/run/secrets/grpc/ca.crt
      GRPC_SERVER_PORT: 9090
    expose: ["8080", "9090"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
      - ./certs/generated/grpc/finance-client:/run/secrets/grpc:ro
    depends_on:
      <<: *service-dependencies
      user:
        condition: service_started
    networks: [vistay]

  payment:
    container_name: service-payment
    build: ../service_payment
    profiles: ["epic01", "full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_payment_db
      DB_USERNAME: vistay_payment_app
      DB_PASSWORD: ${PAYMENT_DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: vistay_payment_migrator
      SPRING_FLYWAY_PASSWORD: ${PAYMENT_DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-payment" password="${KAFKA_PAYMENT_PASSWORD}";
      FINANCE_GRPC_ADDRESS: static://finance:9090
      USER_GRPC_ADDRESS: static://user:9090
      BOOKING_GRPC_ADDRESS: static://booking:9090
      BOOKING_GRPC_SSL_BUNDLE: grpc-user-client
      USER_GRPC_SSL_BUNDLE: grpc-user-client
      GRPC_CLIENT_CERT: file:/run/secrets/grpc/payment.crt
      GRPC_CLIENT_KEY: file:/run/secrets/grpc/payment.key
      GRPC_SERVER_CA_CERT: file:/run/secrets/grpc/ca.crt
      GRPC_SERVER_PORT: 9090
      PAYMENT_ACTIVATION_MODE: ${PAYMENT_ACTIVATION_MODE:-DISABLED}
      VIETQR_BASE_URL: ${VIETQR_BASE_URL:-https://api.vietqr.io}
      VIETQR_CLIENT_ID: ${VIETQR_CLIENT_ID:-}
      VIETQR_API_KEY: ${VIETQR_API_KEY:-}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:-}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
      VIETQR_CALLBACK_CLIENT_ID: ${VIETQR_CALLBACK_CLIENT_ID:-}
      VIETQR_CALLBACK_CLIENT_SECRET: ${VIETQR_CALLBACK_CLIENT_SECRET:-}
    expose: ["8080", "9090"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
      - ./certs/generated/grpc/payment-client:/run/secrets/grpc:ro
    depends_on:
      <<: *service-dependencies
      redis:
        condition: service_healthy
      finance:
        condition: service_started
      user:
        condition: service_started
    networks: [vistay]

  operations:
    container_name: service-operations
    build: ../service_operations
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_operations_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-operations" password="${KAFKA_OPERATIONS_PASSWORD}";
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
    depends_on: *service-dependencies
    networks: [vistay]

  ota:
    container_name: service-ota
    build: ../service_ota
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_ota_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-ota" password="${KAFKA_OTA_PASSWORD}";
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
    depends_on: *service-dependencies
    networks: [vistay]

  media:
    container_name: service-media
    build: ../service_media
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_media_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-media" password="${KAFKA_MEDIA_PASSWORD}";
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
    depends_on:
      <<: *service-dependencies
      minio:
        condition: service_healthy
    networks: [vistay]

  warehouse:
    container_name: service-data-warehouse
    build: ../service_data_warehouse
    profiles: ["full"]
    environment:
      <<: *service-environment
      DB_NAME: vistay_warehouse_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="vistay-warehouse" password="${KAFKA_WAREHOUSE_PASSWORD}";
    expose: ["8080"]
    volumes:
      - ./certs/generated/kafka/client:/run/secrets/kafka:ro
    depends_on: *service-dependencies
    networks: [vistay]

  frontend-customer:
    build: ../frontend_customer
    profiles: ["full"]
    expose: ["8080"]
    networks: [vistay]

  frontend-host:
    build: ../frontend_host
    profiles: ["full"]
    expose: ["8080"]
    networks: [vistay]

  frontend-admin:
    build: ../frontend_admin
    profiles: ["epic01", "full"]
    expose: ["8080"]
    networks: [vistay]
